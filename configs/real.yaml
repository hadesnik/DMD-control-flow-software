# Real hardware config for Phase 3: NI6323 DAQ + DLP650LNIR DMD (ALP-4.3).
# Switch from mock.yaml to this config when the NIR DMD arrives.
# All DLL/device paths are for the scope PC (Windows).
hardwareKind: real

# DMD configuration. Consumed by tfp.hardware.DLP650LNIR_DMD.initialize.
# alpVersion and dmdType default to '4.3'/'DLP650LNIR' when omitted.
dmd:
  dllPath: 'C:\Program Files\ALP-4.3\ALP-4.3 high-speed API\x64\alp4395.dll'
  protoFile: 'vendor\alp\reference\parot-alptool\alpV43x64proto.m'
  loadLatencyMsPerPattern: 10
  debugFigure: false
  # Pixel scale: 10.8 µm pitch / ~40x optical demag → 0.270 µm/px.
  # Central 6×6 mm active region: 6 mm / 10.8 µm/px = 556 px → roiHalfWidthPx = 278.
  # Both values need re-verification once the optical path is measured on the rig.
  umPerPixel: 0.270
  roiHalfWidthPx: 278

# DAQ configuration. Consumed by tfp.hardware.NI6323_DAQ.initialize.
# Confirmed wiring (cross-referenced with Masato's DAQ code, 2026-05-29):
#   ai2: patch electrode / Multiclamp 700B output (primary ephys)
#   ai3: SLM/stim trigger monitor — reads back the stimulation trigger line
#   ao0: Multiclamp 700B ch1 command (postsynaptic cell)
#   ao2: Multiclamp 700B ch2 command (presynaptic cell, normally unused)
#   ao3: NKT FS-50 power modulator (photostim laser power control)
#   port0/line10 (DO): ScanImage acquisition trigger
#   port0/line8  (DO): SLM trigger out (Masato's SLM; spare for our DMD rig)
#   port0/line1  (DI): ScanImage frame clock (rising edge = frame acquired)
daq:
  deviceName: 'Dev1'
  sampleRate: 20000
  analogInChannels: [2, 3]
  aiRangeV: [-5, 5]
  # ai3 reads a 0-5V trigger monitor signal; use SingleEnded not differential.
  aiSingleEndedChannels: [3]
  analogOutChannels: [0, 3]
  digitalOutChannels:
    - 'port0/line10'   # ScanImage acquisition trigger
    - 'port0/line8'    # SLM sequence-advance TTL (Meadowlark; was Masato's spare)
  digitalInChannels:
    - 'port0/line1'    # ScanImage frame clock (rising edge = frame acquired)

# Imaging parameters. Consumed by ScanImageBridge (Phase 2+).
imaging:
  frameRate: 30
  fovSizePx: 512
  fovSizeUm: 800
  simulateLatency: false

# Filesystem paths for session data and calibration.
session:
  dataDir: 'C:\data'
  calibration_file: ''   # fill in after first alignDMDtoCamera run

# Laser modulation. FS-50 path is the legacy rig (ao3); the CARBIDE bringup
# arm uses an external modulator on a TBD analog output — set the channel
# once the modulator is wired, then run scripts/run_powerMeterSweep.m to
# calibrate volts -> mW into carbide_calibration_file.
laser:
  fs50_ao_channel: 'ao3'
  modulation_voltage_max: 5.0
  modulation_voltage_min: 0.0     # 0 V = laser off
  calibration_file: ''
  default_power_mw: 1.0
  carbide_modulator_ao_channel: ''   # TBD — e.g. 'ao1' when the modulator lands
  carbide_voltage_max: 5.0
  carbide_voltage_min: 0.0
  carbide_calibration_file: ''

# Power meter — Thorlabs PM100D, serial P0004058.
# Accessed via TLPM_64.dll (vendor/thorlabs/TLPM.m); no config fields needed,
# resource string is auto-discovered by TLPM.findRsrc().
# Use with S350C thermal sensor head; set wavelengthNm to match laser.

# Substage widefield camera — Basler acA2500-14um (USB3 Vision, serial 22016738).
# Consumed by tfp.hardware.BaslerSubstageCamera.initialize.
# imaqhwinfo('gentl',1) confirmed: DeviceIDs=[1], SupportedFormats={'Mono8','Mono12'}.
camera:
  class: 'tfp.hardware.BaslerSubstageCamera'
  deviceId: 1
  format: 'Mono8'
  exposureMs: 10        # ms; increase if spots are underexposed
  gain: 0               # dB; 0 = minimum noise
  umPerPixel: 1.56      # µm per camera pixel at the sample; remeasure after mounting

# No fake cells for real hardware — live cells identified by suite2p.
fakeCells: []

# ScanImage bridge: real-time ROI fluorescence streaming (TASK-P3-09).
# streamLiveF requires a frameAcquiredFcn callback on the imaging PC
# (see scripts/si_frame_callback.m) that mssend's F values back per frame.
# %VERIFY with Masato: confirm ROI Integration is enabled before enabling.
scanimage:
  streamLiveF: true          # enable real-time F packet polling in waitForCompletion
  nExpectedCells: 10         # pre-allocate liveF_ accumulator rows
  frameStreamPort: 3044      # F-stream socket (3043 is the CONTROL channel;
                             # this key previously said 3043 "same socket as
                             # control", contradicting the bridge's 3044
                             # constant — see docs/PORTS.md)

# --- Meadowlark 1K SLM (remote focusing) — see docs/PORTS.md, slm_pc_setup/ ---
slm:
  enabled: false             # flip true once the SLM PC server is up
  backend: 'remote'          # 'remote' (SLM PC via msocket) | 'mock' | 'dlpc900'
  host: ''                   # SLM PC address (REQUIRED for backend remote)
  port: 3046
  msocketPath: ''
  nRows: 1024
  nCols: 1024
  pitch_um: 17.0
  nStates: 256
  lambda_nm: 1038            # measured CARBIDE [CERT], not the 1030 setpoint
  lut_file: ''               # wavelength LUT on the SLM PC ('' until located)
  wfc_file: ''               # per-device wavefront map ('' = flat)
  m_relay: 0.0               # SLM->objective-BFP pupil relay mag. REQUIRED
                             # when enabled; no handoff key yet (%VERIFY —
                             # requested as slm_bfp_relay_mag at the f7=300
                             # regen). The z-calibration fits the true scale.
  trigger_mode: 'software'   # 'software' until the Blink audit confirms
                             # this unit's external-trigger sequencing; then 'ttl'
  trigger_line: 'port0/line8'
  trigger_pulse_s: 0.0002
  settle_s: 0.0034           # Meadowlark LC response (handoff §6)
  uniform_blob_fraction: 0.02
  calibration_file: ''       # from calibrateSlmDefocus (saveCalibration)

# Objective on the rig — registry names in tfp.optics.objectives.
objective:
  name: 'nikon10x045'        # nikon10x045 | olympus20x | nikon16x | avocado10x

# Optotune ETL multi-plane imaging (ScanImage fastZ). The ETL's um scale is
# NOT trusted — calibrateEtlPlanes puts planes on the MP-285 ruler.
etl:
  n_planes: 3
  plane_calibration_file: '' # from composeZCalibration (saveCalibration)

# Axial ground-truth ruler (Sutter MP-285).
# DEFAULT (Option A): the rig MP-285 moves the Sutter MOM objective; the
# sample stays put. A second option (sample-mount) is commented out below.
zstage:
  backend: 'relay'           # 'relay' (via imaging-PC si_motor_helper) |
                             # 'mp285' (serial switch box to this PC) |
                             # 'manual' | 'mock'
  host: ''                   # imaging PC address (relay backend)
  relay_port: 3047
  serial_port: 'COM5'        # mp285 backend (%VERIFY port + usteps_per_um)
  usteps_per_um: 25
  mount: 'objective'         # 'objective' (DEFAULT: stage moves the MOM
                             # objective) | 'sample' (Option B below).
                             # Gates commanded XY moves to the sample mount.
  direction_sign: 1          # +1|-1: which RAW MP-285 z direction is
                             # "deeper into sample" (the ZStage contract).
                             # DEPENDS ON THE MOUNT — the two mounts are
                             # opposite. Bench-check per the sign section of
                             # docs/mp285-protocol-audit.md.
  # --- OPTION B (SECOND OPTION — NOT the default) --------------------------
  # A spare MP-285 on this PC's serial port carries the substage Basler AND
  # the fluorescent slide as one rigid unit; the objective stays fixed. The
  # camera then stays focused on the film through every through-focus sweep
  # (removes a systematic bias in the fitted defocus slope) and calibration
  # is fully DAQ-PC-local (no si_motor_helper). Its XY axes give fresh film
  # area / burn-grid tiling — but XY moves translate BOTH lateral affines.
  # See docs/BRINGUP_GUIDE.md §5 Option B before enabling.
  # backend: 'mp285'
  # mount: 'sample'
  # direction_sign: -1       # %VERIFY on bench — expected opposite of the
  #                          # objective mount, but confirm, do not assume.
  # serial_port: 'COM6'      # %VERIFY the spare unit's port
  # usteps_per_um: 25        # %VERIFY on the spare unit (audit item #1)

# 3D photostimulation mode (exp_3d_ensemble; optional flag on experiments).
threeD:
  enabled: false
  dz_bin_um: 10              # depth-group bin width (um)
  depth_gradient_sign: 1     # +/-1, resolved on the rig; MAGNITUDE always
                             # comes from the handoff at runtime
  pace_trials: true          # real-time pacing of free-run trials
