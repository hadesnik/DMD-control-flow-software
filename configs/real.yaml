# Real hardware config for Phase 3: NI6323 DAQ + DLP650LNIR DMD (ALP-4.3).
# Switch from mock.yaml to this config when the NIR DMD arrives.
# All DLL/device paths are for the scope PC (Windows).
hardwareKind: real

# DMD configuration. Consumed by tfp.hardware.DLP650LNIR_DMD.initialize.
dmd:
  alpVersion: '4.3'
  dmdType: 'DLP650LNIR'
  dllPath: 'C:\Program Files\ALP-4.3\ALP-4.3 high-speed API\x64\alp4395.dll'
  # DLL is loaded via the official Vialux C header (see
  # DLP650LNIR_DMD.initialize), not a calllib proto file. Requires the
  # in-repo header below plus a MinGW/MSVC compiler on the scope PC.
  headerPath: 'vendor\alp\official\alp.h'
  loadLatencyMsPerPattern: 10
  debugFigure: false

  # --- Bring-up optical path geometry (TASK-BU) --------------------------------
  # Source: docs/dmd_control_handoff.md, build 33010FL01-530R 6.0mm 80/300 150/80.
  # Read these through tfp.util.opticalModel, not directly.
  #
  # ALL VALUES BELOW ARE DESIGN INTENT, NOT CALIBRATION.  %VERIFY every one.
  # Per §9 of the handoff, the control code fits its own affine from a measured
  # grid and uses these only as a starting point and a sanity check. The single
  # largest risk is the periscope: its 200/150 pair's lens order is unconfirmed,
  # and reversing it changes every µm/px figure below by 1.778x.

  # The chip is mounted clocked 45 deg about its own normal, so the optical axes
  # are the chip DIAGONALS, not its rows and columns. Every sample<->DMD
  # transform carries this rotation.
  clockingDeg: 45

  # Sample-plane scale is ANISOTROPIC: the grating disperses along one chip
  # diagonal only. A circle drawn in DMD pixels lands as an ellipse at the
  # sample. Supersedes the old isotropic 0.270 um/px guess (which assumed ~40x
  # demag and was ~4x too small).
  umPerPixelGroove: 1.1250        # pitch * M1 / M_gs = 10.8 * 3.75 / 36
  umPerPixelDispersion: 1.4162    # that * cos(beta)/cos(alpha)
  anisotropy: 1.2588              # = umPerPixelDispersion / umPerPixelGroove

  # Illuminated patch. The beam is a raw Gaussian (no piShaper), so only the
  # middle of the chip is usable and mirrors outside the patch must be OFF.
  # patchCenterPx is the ILLUMINATION CENTROID, which is not necessarily the
  # chip centre (chip centre is [640, 400]) — measure it on the rig (T-BU-M3).
  patchCenterPx: [640, 400]       # [col row], %VERIFY on rig
  patchRadiusPx: 278              # design patch, 6.0 mm diameter = 556 px
  patchMaxRadiusPx: 329           # HARD limit, 7.12 mm dia; beyond this the
                                  # beam clips lens La and the grating ruling
  roiHalfWidthPx: 278             # legacy alias of patchRadiusPx

  # Gaussian illumination profile: I(r)/I0 = exp(-2 * r_px^2 / gaussianWaistPx^2).
  # Falls to 0.61 at the patch edge, so an edge target needs 1.65x the dwell of
  # a centre target for the same dose. Corrected in TIME, not fill fraction —
  # see tfp.patterns.dwellCorrection.
  gaussianWaistPx: 555.6

  # The excitation surface is a tilted plane (1.245 deg), entirely along the
  # dispersion axis; there is no PLM in this build to correct it. Depth walks
  # 17.1 um across the patch against a 17.7 um axial FWHM, so targets at
  # opposite field edges are NOT in the same plane.
  depthGradientUmPerUm: 0.02174   # z_um ~= x_disp * this
  focalPlaneTiltDeg: 1.245
  axialFwhmUm: 17.7               # [LOW +/-40%] per the handoff

  # Addressable field at the sample: an ellipse, not the 3x3 mm full-build goal.
  fieldExtentUm: [625, 787]       # [groove, dispersion]

  # Sign conventions are NOT specified by the optics doc — which chip diagonal
  # is +dispersion, and which way depth runs, both depend on how the grating and
  # folds were actually installed. Resolve by two-point calibration (T-BU-M4).
  dispersionAxisSign: 1           # %VERIFY, +/-1
  depthGradientSign: 1            # %VERIFY, +/-1

  # Chip and timing constants (datasheet, not calibration).
  pitchUm: 10.8
  binaryFrameRateHz: 12500        # 80 us per binary frame

  # DEPRECATED: isotropic scalar scale. Retained only until the last consumer is
  # removed (TASK-BU T-BU-2b). Use umPerPixelGroove / umPerPixelDispersion.
  umPerPixel: 0.270

# DAQ configuration. Consumed by tfp.hardware.NI6323_DAQ.initialize.
# Confirmed wiring (cross-referenced with Masato's DAQ code, 2026-05-29):
#   ai2: patch electrode / Multiclamp 700B output (primary ephys)
#   ai3: SLM/stim trigger monitor — reads back the stimulation trigger line
#   ao0: Multiclamp 700B ch1 command (postsynaptic cell)
#   ao2: Multiclamp 700B ch2 command (presynaptic cell, normally unused)
#   ao3: photostim laser power modulator (control). Laser change 2026-07-24:
#        FS-50 removed; incoming Light Conversion Carbide (40 W). %VERIFY the
#        Carbide control interface (analog ao3 vs. Light Conversion API).
#   port0/line10 (DO): ScanImage acquisition trigger
#   port0/line8  (DO): SLM trigger out (Masato's SLM; spare for our DMD rig)
#   port0/line1  (DI): ScanImage frame clock (rising edge = frame acquired)
daq:
  deviceName: 'Dev1'
  sampleRate: 20000
  analogInChannels: [2, 3]
  aiRangeV: [-5, 5]
  # ai3 reads a 0-5V trigger monitor signal; use SingleEnded not differential.
  aiSingleEndedChannels: [3]
  analogOutChannels: [0, 3]
  digitalOutChannels: [port0/line10]   # ScanImage acquisition trigger
  digitalInChannels: [port0/line1]     # ScanImage frame clock (rising edge = frame acquired)

# Imaging parameters. Consumed by ScanImageBridge (Phase 2+).
imaging:
  frameRate: 30
  fovSizePx: 512
  fovSizeUm: 800
  simulateLatency: false

# Filesystem paths for session data and calibration.
session:
  dataDir: 'C:\data'
  calibration_file: ''   # fill in after first alignDMDtoCamera run

# Laser modulation. Analog output ao3 on the NI PCIe-6323.
# Laser: Light Conversion Carbide (40 W) incoming (~early Sept 2026); the NKT
# FS-50 was removed from this rig. %VERIFY the Carbide's power-control interface
# on arrival. The `fs50_ao_channel` key keeps its legacy name (it just selects
# the photostim-laser AO channel; read by DAQ.configureLaserSafety).
laser:
  fs50_ao_channel: 'ao3'
  modulation_voltage_max: 5.0
  modulation_voltage_min: 0.0     # 0 V = laser off
  calibration_file: ''
  default_power_mw: 1.0
  # --- Laser-power safety (enforced at the DAQ ao3 choke points; see CLAUDE.md) ---
  # %power = 100 * V / modulation_voltage_max (linear, full-rep-rate worst case;
  # lower rep rates deliver less power, so this never under-estimates).
  # Re-confirm the Carbide's V->power / rep-rate behaviour on arrival.
  confirm_power_pct: 10          # > this % of max -> confirmation dialog
  max_sustained_power_pct: 20    # > this %, held >= sustained_duration_s -> HARD BLOCK
  sustained_duration_s: 1.0
  autoConfirmPower: false        # rig: never auto-confirm; >10% blocks non-interactively

  # --- Pupil pulse-energy interlock (TASK-BU T-BU-1d) --------------------------
  # A SECOND, independent hazard from the one above. Every 4f relay of a
  # collimated DMD forms a real focus in air at its pupil; with a high-fill
  # pattern the whole pulse lands in one ~27 um spot there and can ionise air.
  # The pupil peak scales with the SQUARE of the pattern's mean, so sparse
  # patterns are orders of magnitude safer and the dangerous case is precisely
  # the all-ON alignment frame.
  #
  # NOTE THE INVERSION: the ao3 policy above is conservative because lowering
  # the rep rate lowers real power. That is BACKWARDS here — at fixed average
  # power, lowering the rep rate RAISES pulse energy. The two guards are
  # conservative in opposite directions and BOTH must run.
  # Mitigation is always "raise the rep rate", never "raise the pulse energy".
  rep_rate_hz: 100000               # %VERIFY on CARBIDE arrival
  max_power_w: 40                   # CARBIDE rated output. NB: docs/dmd_control_handoff.md
                                    # §7 says 80 W — that is an error in the
                                    # generator (see the banner at the top of
                                    # that doc). 40 W is correct.
  max_pulse_energy_uj_pupil: 68     # air-ionisation limit at the pupil focus for
                                    # a 230 fs pulse. A property of the OPTICS,
                                    # not of the laser — unchanged by the 80->40 W
                                    # correction. Full-field ON exceeds it ~5.9x.
  pupil_interlock_fill_fraction: 0.2  # fill above which the pupil check applies

# Power meter — Thorlabs PM100D, serial P0004058.
# Accessed via TLPM_64.dll (vendor/thorlabs/TLPM.m); no config fields needed,
# resource string is auto-discovered by TLPM.findRsrc().
# Use with S350C thermal sensor head; set wavelengthNm to match laser.

# Substage widefield camera — Basler acA2500-14um (USB3 Vision, serial 22016738).
# Consumed by tfp.hardware.BaslerSubstageCamera.initialize.
# imaqhwinfo('gentl',1) confirmed: DeviceIDs=[1], SupportedFormats={'Mono8','Mono12'}.
camera:
  class: 'tfp.hardware.BaslerSubstageCamera'
  deviceId: 1
  format: 'Mono8'
  exposureMs: 10        # ms; increase if spots are underexposed
  gain: 0               # dB; 0 = minimum noise
  umPerPixel: 1.56      # µm per camera pixel at the sample; remeasure after mounting

# Axial (focus) stage — Sutter MP-285/MP-285A objective Z, direct serial on the
# DAQ PC. Consumed by tfp.calibration.measureFocalPlaneTilt via tfp.hardware.SutterZStage.
# For the tilt calibration, replug the Sutter serial from the imaging PC to the DAQ
# PC (release it from ScanImage first); replug back afterward. See CLAUDE.md runbook.
zstage:
  class: 'tfp.hardware.SutterZStage'
  serialPort: 'COM5'          # %VERIFY — DAQ-PC COM port for the Sutter controller
  baud: 9600                  # MP-285 default, 8-N-1
  umPerMicrostep: 0.04        # %VERIFY — firmware-dependent (some units 0.2 µm)
  focusAxis: 'z'              # which MP-285 axis is objective focus
  moveTimeoutS: 30
  rangeUm: [-1000, 1000]      # %VERIFY soft travel limits

# No fake cells for real hardware — live cells identified by suite2p.
fakeCells: []

# ScanImage bridge: real-time ROI fluorescence streaming (TASK-P3-09).
# streamLiveF requires a frameAcquiredFcn callback on the imaging PC
# (see scripts/si_frame_callback.m) that mssend's F values back per frame.
# %VERIFY with Masato: confirm ROI Integration is enabled before enabling.
scanimage:
  streamLiveF: true          # enable real-time F packet polling in waitForCompletion
  nExpectedCells: 10         # pre-allocate liveF_ accumulator rows
  frameStreamPort: 3043      # same socket as control channel

# SLM (spatial light modulator) configuration. Consumed by
# tfp.hardware.RemoteSLM and tfp.patterns.threeDShot.defaultParams.
slm:
  connectionMode: msocket
  dims: [1024, 1024]
  pitch_um: 17
  lutFile: ''                 # %VERIFY path to Meadowlark phase LUT file on SLM PC
  slmPcIp: '192.168.1.100'   # %VERIFY IP address of the SLM PC on the rig network
  slmPort: 3046
  msocketPath: ''             # %VERIFY path to msocket DLL/toolbox on this PC
  overdrive: false
  lambda_nm: 1030
  f_ft_um: 16800              # %VERIFY focal length of Fourier transform lens (µm)
  mag: 1.0                    # %VERIFY relay magnification from SLM to objective BFP
  NA_eff: 0.6                 # %VERIFY effective NA at sample with SLM path
  n: 1.33
  diskRadius_um: 5
  gsIters: 20
  gsWeighted: true
  gsSeed: 0
  maxCells: 20
  addressableRadiusUm: 150
  minSpacingUm: 15
  slmScanCalib_file: ''       # %VERIFY path to SLM-to-ScanImage calibration .mat
  efficiencyMap_file: ''      # %VERIFY path to SLM efficiency map .mat

# Power-curve experiment parameters. Consumed by exp_power_curve_3dshot.
powerCurve:
  perCellPowersMw: [1, 2, 4]
  nReps: 2
