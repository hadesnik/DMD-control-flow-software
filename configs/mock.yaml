# Mock hardware config for Phase 1/1.5 end-to-end tests and experiments.
# Selector for the hardware factory in experiment scripts.
hardwareKind: mock

# DMD configuration. Consumed by tfp.hardware.MockDMD.initialize.
dmd:
  nRows: 800
  nCols: 1280
  maxPatternRate: 12500
  loadLatencyMsPerPattern: 0
  debugFigure: false

# DAQ configuration. Consumed by tfp.hardware.MockDAQ.initialize.
# Experiments configure all channels before running Sequencer.
daq:
  sampleRate: 10000
  analogInChannels: [0, 1]
  analogOutChannels: [0]
  digitalOutChannels: [port0/line0]
  digitalInChannels: [port0/line2]   # ScanImage frame clock
  aiRangeV: [-5, 5]

# Filesystem paths. Experiments create <dataDir>/<sessionName>/ per run.
paths:
  dataDir: ./data

# Calibration file path; empty -> identity affine fallback (mock).
calibration_file: ""

# ScanImage bridge (not used in Phase 1 / mock).
scanimage:
  enabled: false
  streamLiveF: false         # mock path: getLiveTraces() returns lastResult_.F directly
  nExpectedCells: 10

# Imaging parameters. Consumed by tfp.hardware.MockScanImageBridge.
imaging:
  frameRate: 30          # Hz
  fovSizePx: 512         # square FOV in pixels
  fovSizeUm: 800         # approximate FOV in microns
  simulateLatency: false # set true to add real acquisition pauses

# --- 3D / SLM sections (disabled by default; mirror real.yaml schema) ---
slm:
  enabled: false
  backend: 'mock'            # MockSLM (Meadowlark-shaped simulator)
  nRows: 1024
  nCols: 1024
  pitch_um: 17.0
  nStates: 256
  lambda_nm: 1038
  m_relay: 1.2               # mock value; real rig must measure (%VERIFY)
  trigger_mode: 'software'
  settle_s: 0.0
  uniform_blob_fraction: 0.02
  calibration_file: ''

objective:
  name: 'nikon10x045'

etl:
  n_planes: 3
  plane_calibration_file: ''

zstage:
  backend: 'mock'
  startZUm: 0

threeD:
  enabled: false
  dz_bin_um: 10
  depth_gradient_sign: 1
  pace_trials: false         # mock: never wall-clock-pace trials

# Fake cells for the all-optical mock pipeline (Phase 1.5).
# Parsed by tfp.io.loadConfig into a 1×N struct array.
# Converted to tfp.sim.CellResponseModel objects in the experiment script.
# Optional per-cell dmdZUm (µm depth) feeds the 3D response chain.
fakeCells:
  - tag: cell_01
    dmdCol: 400
    dmdRow: 400
    radiusDmd: 8
    amplitude: 1.5
    sigma: 10
    aiChannel: 0
  - tag: cell_02
    dmdCol: 500
    dmdRow: 400
    radiusDmd: 8
    amplitude: 1.2
    sigma: 10
    aiChannel: 1
  - tag: cell_03
    dmdCol: 600
    dmdRow: 400
    radiusDmd: 8
    amplitude: 1.8
    sigma: 10
    aiChannel: 2

# Laser modulation (NKT FS-50). Ignored in mock mode — included for
# config schema parity with real.yaml.
laser:
  fs50_ao_channel: 'ao3'
  modulation_voltage_max: 5.0
  modulation_voltage_min: 0.0     # 0 V = laser off
  calibration_file: ''
  default_power_mw: 1.0
  # CARBIDE external modulator (build B). '' means UNWIRED: every output
  # through tfp.hardware.LaserPowerController refuses until it is set.
  carbide_modulator_ao_channel: 'ao1'
  carbide_voltage_max: 5.0
  carbide_voltage_min: 0.0
  carbide_calibration_file: ''
  # Laser -> sample end-to-end transmission. The volts->mW curve is measured
  # AT THE SAMPLE but the relay-pupil hazard is upstream of everything, so
  # tfp.util.assertPulseEnergySafe scales by this. 0.182 is the handoff
  # section 7a figure and is %VERIFY until measured on the bench.
  arm_transmission: 0.182

# Substage camera. backend is read by tfp.hardware.makeCamera; 'class' is the
# legacy spelling and is still parsed.
camera:
  backend: 'mock'
  nRows: 512
  nCols: 512
  noiseLevel: 0.02
  spotSigmaPx: 4
  exposureMs: 10
  gain: 0
  binning: 1
  format: 'Mono8'
  umPerPixel: 1.56

# Results the calibration session may write back (see docs/CALIBRATION_GUI.md).
calibration:
  scan_fast_axis_sign: 0     # 0 = unresolved; verifyScanFieldComposition writes +1/-1
  scan_slow_axis_sign: 0
  field_tilt_file: ''
  lateral_file: ''

# Trial timing defaults.
trial:
  preStim_s: 1.0
  stimDuration_s: 0.25
  postStim_s: 3.0
  nReps: 5
  distancesUm: [0, 3, 6, 9, 12, 15, 20, 30, 40]
  shuffle: true
